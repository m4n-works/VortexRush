<style>
:root{--c1:#ff2bd6;--c2:#00f0ff;--c3:#ffe14d}
html,body{margin:0;height:100%;overflow:hidden;background:#05010d;font-family:'Orbitron','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;top:16px;left:20px}
.tr{position:absolute;top:16px;right:20px;text-align:right}
#score{font-size:34px;font-weight:900;letter-spacing:2px;text-shadow:0 0 12px var(--c1)}
#mult{font-size:22px;font-weight:700;color:var(--c2);text-shadow:0 0 10px var(--c2)}
#combobar{width:150px;height:4px;background:#ffffff22;margin-top:6px;border-radius:2px;overflow:hidden}
#combofill{height:100%;background:var(--c2);width:0}
#dist{font-size:22px;font-weight:700}
#spd{font-size:14px;opacity:.75;margin-top:2px}
#sector{font-size:12px;opacity:.6;letter-spacing:3px;margin-top:4px}
#shieldIco{font-size:13px;color:#66ccff;margin-top:6px;letter-spacing:2px;text-shadow:0 0 8px #66ccff}
#odwrap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(360px,72vw);text-align:center}
#odlabel{font-size:11px;letter-spacing:4px;margin-bottom:6px;opacity:.8}
#odbar{height:10px;border:1px solid #fff6;border-radius:6px;overflow:hidden}
#odfill{height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2))}
#odbar.full{animation:glow .35s infinite alternate}

#center{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:clamp(28px,6vw,52px);font-weight:900;letter-spacing:6px;opacity:0;transition:opacity .3s;text-shadow:0 0 20px var(--c1)}
.pop{position:absolute;left:50%;top:60%;transform:translate(-50%,0);font-weight:900;font-size:22px;white-space:nowrap;animation:pop .9s ease-out forwards;text-shadow:0 0 12px currentColor}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.25)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0004 0%,#000c 85%);text-align:center;padding:16px;box-sizing:border-box}
.hidden{display:none!important}

button{pointer-events:auto;margin-top:26px;font:inherit;font-size:20px;font-weight:800;letter-spacing:4px;color:#fff;background:#0006;border:2px solid var(--c2);padding:12px 40px;border-radius:40px;cursor:pointer;box-shadow:0 0 18px var(--c2) inset,0 0 18px var(--c2)}
button:hover{background:#fff1}
.blink{animation:blink 1s infinite;font-size:12px;letter-spacing:3px;margin-top:12px;opacity:.7}
@keyframes blink{50%{opacity:.2}}
#rank{font-size:96px;font-weight:900;line-height:1.1;margin-top:8px}
.stats{font-size:16px;line-height:1.9;margin-top:6px}

#odbtn{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);margin:0;padding:10px 26px;font-size:16px;display:none}

    <kbd>SPACE</kbd> オーバードライブ（ゲージMAX時）　<kbd>M</kbd> ミュート<br>

  </div>
  <div class="tips">

    ⚡ 障害物を<b>ギリギリ</b>で避けると NEAR MISS ボーナス＋スローモー<br>

  <div class="blink">PRESS SPACE</div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- utils ----------
const TAU = Math.PI * 2, PI = Math.PI;
const rand = Math.random, rr = (a, b) => a + rand() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
const $ = id => document.getElementById(id);

// ---------- constants ----------
const R = 7;            // tube radius
const PR = R - 0.9;     // ship orbit radius
const PHALF = 0.92 / PR; // ship half-width in radians
const OD_TIME = 5;
const COMBO_TIME = 2.6;

const THEMES = [
  { tube: 0xff2bd6, obs: 0x00f0ff, gem: 0xffe14d, bg: 0x0a0018 },
  { tube: 0x00ff9d, obs: 0xff3b5c, gem: 0x7df9ff, bg: 0x00120d },
  { tube: 0xffa21f, obs: 0xb04dff, gem: 0x00ffcc, bg: 0x120700 },
  { tube: 0x3d8bff, obs: 0xffef3d, gem: 0xff4df0, bg: 0x000818 },
  { tube: 0xff3030, obs: 0xffffff, gem: 0x30ff80, bg: 0x120000 },
  { tube: 0xffffff, obs: 0xff2bd6, gem: 0x00f0ff, bg: 0x080808 },
];

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(THEMES[0].bg);
scene.fog = new THREE.Fog(THEMES[0].bg, 60, 200);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 500);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.4, 0.32);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ---------- colors ----------
const col = { tube: new THREE.Color(), obs: new THREE.Color(), gem: new THREE.Color(), bg: new THREE.Color() };
const tmpC = new THREE.Color();
let theme = THEMES[0];
for (const k in col) col[k].setHex(theme[k]);

// ---------- tube ----------
const tubeGeo = new THREE.CylinderGeometry(R, R, 440, 72, 1, true);
tubeGeo.rotateX(PI / 2); tubeGeo.translate(0, 0, -205);
const tubeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { uDist: { value: 0 }, uColor: { value: new THREE.Color() }, uBg: { value: new THREE.Color() }, uPulse: { value: 0 } },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uDist; uniform vec3 uColor; uniform vec3 uBg; uniform float uPulse; varying vec3 vP;
    void main(){
      float a = atan(vP.y, vP.x) / 6.2831853 + 0.5;
      float z = vP.z - uDist;
      float la = smoothstep(0.43, 0.5, abs(fract(a * 24.0) - 0.5));
      float lz = smoothstep(0.41, 0.5, abs(fract(z / 6.0) - 0.5));
      float big = smoothstep(0.475, 0.5, abs(fract(z / 60.0) - 0.5));
      float line = max(la * 0.55, lz * 0.9) + big * 1.6;
      float near = smoothstep(-210.0, -15.0, vP.z);
      vec3 c = uBg * 1.4 + uColor * line * (0.12 + 0.5 * near) * (1.0 + uPulse);
      c += uColor * 0.025 * near;
      gl_FragColor = vec4(c, 1.0);
    }`
});
scene.add(new THREE.Mesh(tubeGeo, tubeMat));

// ---------- materials ----------
const obsFill = new THREE.MeshBasicMaterial({ color: 0x000000 });
const obsEdge = new THREE.LineBasicMaterial({ color: 0xffffff });
const gemMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const gemGeo = new THREE.OctahedronGeometry(0.45);
const shieldGeo = new THREE.IcosahedronGeometry(0.6, 0);
const shieldPickMat = new THREE.MeshBasicMaterial({ color: 0x66ccff, wireframe: true });

// ---------- ship ----------
const ship = new THREE.Group();
const shipInner = new THREE.Group();
ship.add(shipInner); scene.add(ship);
const shipEdgeMat = new THREE.LineBasicMaterial({ color: 0xffffff });
const shipWingEdge = new THREE.LineBasicMaterial({ color: 0xffffff });
{
  const body = new THREE.ConeGeometry(0.34, 1.8, 4); body.rotateY(PI / 4); body.rotateX(-PI / 2);
  const bm = new THREE.Mesh(body, new THREE.MeshBasicMaterial({ color: 0x14141f }));
  bm.add(new THREE.LineSegments(new THREE.EdgesGeometry(body), shipEdgeMat));
  shipInner.add(bm);
  const ws = new THREE.Shape();
  ws.moveTo(0, -0.2); ws.lineTo(1.05, 0.55); ws.lineTo(0.95, 0.75); ws.lineTo(0, 0.55); ws.lineTo(-0.95, 0.75); ws.lineTo(-1.05, 0.55); ws.closePath();
  const wg = new THREE.ExtrudeGeometry(ws, { depth: 0.06, bevelEnabled: false });
  wg.rotateX(PI / 2); wg.translate(0, 0, 0.0);
  const wm = new THREE.Mesh(wg, new THREE.MeshBasicMaterial({ color: 0x14141f }));
  wm.add(new THREE.LineSegments(new THREE.EdgesGeometry(wg), shipWingEdge));
  shipInner.add(wm);
}
const engine = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
engine.position.z = 0.9; shipInner.add(engine);
const shieldBubble = new THREE.Mesh(new THREE.IcosahedronGeometry(1.25, 1), new THREE.MeshBasicMaterial({ color: 0x66ccff, wireframe: true, transparent: true, opacity: 0.55 }));
shieldBubble.visible = false; shipInner.add(shieldBubble);

// ---------- particles ----------
const PN = 2000;
const pPos = new Float32Array(PN * 3), pCol = new Float32Array(PN * 3), pVel = new Float32Array(PN * 3), pBase = new Float32Array(PN * 3);
const pLife = new Float32Array(PN), pMax = new Float32Array(PN);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const spriteTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.3, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();
const pMat = new THREE.PointsMaterial({ size: 0.22, map: spriteTex, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const points = new THREE.Points(pGeo, pMat); points.frustumCulled = false; scene.add(points);
let pIdx = 0;
function emit(x, y, z, color, n, spd, life = 0.8, vz = 0) {
  for (let i = 0; i < n; i++) {
    const k = pIdx; pIdx = (pIdx + 1) % PN;
    pPos[k * 3] = x; pPos[k * 3 + 1] = y; pPos[k * 3 + 2] = z;
    const u = rr(-1, 1), t = rr(0, TAU), s = Math.sqrt(1 - u * u), m = spd * rr(0.25, 1);
    pVel[k * 3] = Math.cos(t) * s * m; pVel[k * 3 + 1] = Math.sin(t) * s * m; pVel[k * 3 + 2] = u * m + vz;
    pLife[k] = pMax[k] = life * rr(0.5, 1);
    pBase[k * 3] = color.r; pBase[k * 3 + 1] = color.g; pBase[k * 3 + 2] = color.b;
  }
}
function updParticles(dt) {
  const drag = Math.max(0, 1 - 1.6 * dt);
  for (let k = 0; k < PN; k++) {
    if (pLife[k] > 0) {
      pLife[k] -= dt;
      const f = Math.max(0, pLife[k] / pMax[k]);
      pPos[k * 3] += pVel[k * 3] * dt; pPos[k * 3 + 1] += pVel[k * 3 + 1] * dt; pPos[k * 3 + 2] += pVel[k * 3 + 2] * dt;
      pVel[k * 3] *= drag; pVel[k * 3 + 1] *= drag; pVel[k * 3 + 2] *= drag;
      pCol[k * 3] = pBase[k * 3] * f; pCol[k * 3 + 1] = pBase[k * 3 + 1] * f; pCol[k * 3 + 2] = pBase[k * 3 + 2] * f;
    } else { pCol[k * 3] = pCol[k * 3 + 1] = pCol[k * 3 + 2] = 0; }
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

// ---------- speed streaks ----------
const SN = 240;
const sPos = new Float32Array(SN * 6), sDat = [];
const sGeo = new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
const sMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false });
const streaks = new THREE.LineSegments(sGeo, sMat); streaks.frustumCulled = false; scene.add(streaks);
for (let i = 0; i < SN; i++) sDat.push({ a: rr(0, TAU), r: rr(1.5, R - 0.4), z: rr(-210, 10) });
function updStreaks(dt) {
  const len = 0.6 + speed * 0.05 + (od > 0 ? 3 : 0);
  for (let i = 0; i < SN; i++) {
    const d = sDat[i]; d.z += speed * dt * 1.2;
    if (d.z > 10) { d.z -= 220; d.a = rr(0, TAU); d.r = rr(1.5, R - 0.4); }
    const x = Math.cos(d.a) * d.r, y = Math.sin(d.a) * d.r;
    sPos.set([x, y, d.z, x, y, d.z - len], i * 6);
  }
  sGeo.attributes.position.needsUpdate = true;
}

// ---------- audio ----------
let actx = null, master, comp, musicBus, mFilter, sfxBus, noiseBuf, musicOn = false, step = 0, nextT = 0, muted = false, pulse = 0;
function initAudio() {
  if (actx) { actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
  comp = actx.createDynamicsCompressor(); comp.connect(master);
  mFilter = actx.createBiquadFilter(); mFilter.type = 'lowpass'; mFilter.frequency.value = 2400; mFilter.Q.value = 3;
  musicBus = actx.createGain(); musicBus.gain.value = 0.5; musicBus.connect(mFilter); mFilter.connect(comp);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(comp);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rand() * 2 - 1;
  setInterval(scheduler, 25);
}
const BPM = 138, S16 = 60 / BPM / 4;
const ROOTS = [55, 43.65, 65.41, 49];           // A F C G
const CHORDS = [[0, 3, 7, 12], [0, 4, 7, 12], [0, 4, 7, 12], [0, 4, 7, 11]];
function scheduler() {
  if (!musicOn) return;
  while (nextT < actx.currentTime + 0.12) { playStep(step, nextT); nextT += S16; step++; }
}
function env(g, t, peak, dec) { g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dec); }
function osc(type, f, t, dur, peak, dest, f2) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, peak, dur); o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  return o;
}
function noise(t, dur, peak, type, freq, dest, f2) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = actx.createGain(); env(g, t, peak, dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t, rand() * 0.5); s.stop(t + dur + 0.05);
}
function playStep(st, t) {
  const s = st % 16, bar = Math.floor(st / 16) % 4, root = ROOTS[bar];
  if (s % 4 === 0) {
    osc('sine', 160, t, 0.28, 1.0, musicBus, 38);
    setTimeout(() => { pulse = 1; }, Math.max(0, (t - actx.currentTime) * 1000));
  }
  if (s % 4 === 2) noise(t, 0.09, 0.22, 'highpass', 7000, musicBus); else if (s % 2 === 1) noise(t, 0.03, 0.08, 'highpass', 9000, musicBus);
  if (s === 4 || s === 12) noise(t, 0.18, 0.35, 'bandpass', 1800, musicBus);
  if (s % 4 !== 0) {
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = 'sawtooth'; o.frequency.value = root * (s % 4 === 2 ? 2 : 1);
    f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(200, t + 0.12);
    env(g, t, 0.32, 0.13); o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.18);
  }
  if (sector >= 1 || od > 0) {
    const ch = CHORDS[bar]; const n = ch[(s * 3) % 4] + (s % 8 >= 4 ? 12 : 0);
    osc('square', root * 4 * Math.pow(2, n / 12), t, 0.11, od > 0 ? 0.09 : 0.045, musicBus);
  }
  if (sector >= 2 && s % 8 === 0) osc('triangle', root * 8 * Math.pow(2, CHORDS[bar][2] / 12), t, 0.5, 0.05, musicBus);
}
const PENTA = [0, 2, 4, 7, 9];
const sfx = {
  gem(c) { if (!actx) return; const t = actx.currentTime; const f = 660 * Math.pow(2, (PENTA[c % 5] + 12 * (Math.floor(c / 5) % 3)) / 12); osc('triangle', f, t, 0.12, 0.25, sfxBus, f * 1.5); osc('sine', f * 2, t + 0.04, 0.1, 0.1, sfxBus); },
  near() { if (!actx) return; const t = actx.currentTime; noise(t, 0.35, 0.5, 'bandpass', 500, sfxBus, 4000); osc('sawtooth', 300, t, 0.25, 0.08, sfxBus, 1200); },
  crash() { if (!actx) return; const t = actx.currentTime; noise(t, 1.4, 1.0, 'lowpass', 3000, sfxBus, 60); osc('sine', 120, t, 0.9, 0.8, sfxBus, 25); },
  smash() { if (!actx) return; const t = actx.currentTime; noise(t, 0.35, 0.7, 'lowpass', 4000, sfxBus, 200); osc('square', 220, t, 0.2, 0.15, sfxBus, 55); },
  power() { if (!actx) return; const t = actx.currentTime; osc('sawtooth', 150, t, 0.7, 0.25, sfxBus, 2400); osc('square', 300, t + 0.05, 0.6, 0.1, sfxBus, 3600); },
  shield() { if (!actx) return; const t = actx.currentTime; [0, 4, 7, 12].forEach((n, i) => osc('triangle', 520 * Math.pow(2, n / 12), t + i * 0.06, 0.15, 0.2, sfxBus)); },
  mult() { if (!actx) return; const t = actx.currentTime; osc('square', 880, t, 0.08, 0.08, sfxBus); osc('square', 1320, t + 0.07, 0.12, 0.08, sfxBus); },
};

// ---------- game state ----------
let state = 'title';
let objs = [];
let dist = 0, speed = 28, theta = -PI / 2, omega = 0, camTheta = -PI / 2;
let score = 0, combo = 0, comboT = 0, mult = 1, maxMult = 1, meter = 0, od = 0, shield = false, inv = 0;
let sector = 0, diff = 0, nextS = 120, slowmo = 0, shake = 0, fovKick = 0, deathT = 0, time = 0;
let gems = 0, nears = 0, smashes = 0, odReadyShown = false;
let best = 0; try { best = +localStorage.getItem('vortexrush_best') || 0; } catch (e) {}

function setCss() {
  const r = document.documentElement.style;
  r.setProperty('--c1', '#' + tmpC.setHex(theme.tube).getHexString());
  r.setProperty('--c2', '#' + tmpC.setHex(theme.obs).getHexString());
  r.setProperty('--c3', '#' + tmpC.setHex(theme.gem).getHexString());
}

// ---------- obstacles ----------
function sectorGeo(width, depth) {
  const inner = R - 1.75, outer = R + 0.3, a0 = -width / 2, a1 = width / 2;
  const s = new THREE.Shape();
  s.moveTo(Math.cos(a0) * outer, Math.sin(a0) * outer);
  s.absarc(0, 0, outer, a0, a1, false);
  s.lineTo(Math.cos(a1) * inner, Math.sin(a1) * inner);
  s.absarc(0, 0, inner, a1, a0, true);
  s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: Math.ceil(width * 5) + 3 });
}
function addWall(s, ang, width, depth = 1.4, spin = 0) {
  const g = sectorGeo(width, depth);
  const m = new THREE.Mesh(g, obsFill);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), obsEdge));
  m.rotation.z = ang; m.position.z = -999;
  scene.add(m);
  objs.push({ type: 'wall', s, ang, width, depth, spin, mesh: m, minClear: 9, passed: false, dead: false });
}
function addGem(s, ang) {
  const m = new THREE.Mesh(gemGeo, gemMat); m.position.set(Math.cos(ang) * PR, Math.sin(ang) * PR, -999);
  scene.add(m); objs.push({ type: 'gem', s, ang, mesh: m });
}
function addShield(s, ang) {
  const m = new THREE.Mesh(shieldGeo, shieldPickMat); m.position.set(Math.cos(ang) * PR, Math.sin(ang) * PR, -999);
  scene.add(m); objs.push({ type: 'shield', s, ang, mesh: m });
}
function gemArc(s, ang, n, sp = 4, dA = 0) { for (let i = 0; i < n; i++) addGem(s + i * sp, ang + i * dA); }
function removeObj(o) {
  scene.remove(o.mesh);
  if (o.type === 'wall') { o.mesh.geometry.dispose(); o.mesh.children[0].geometry.dispose(); }
}
const sgn = () => rand() < 0.5 ? -1 : 1;
const PATTERNS = [
  s => { const a = rr(0, TAU), w = rr(0.9, 1.5) + diff * 0.7; addWall(s, a, w); gemArc(s - 18, a + PI, 4, 4); return 8; },
  s => { const a = rr(0, TAU), gap = rr(1.35, 1.75) - diff * 0.5; addWall(s, a + PI, TAU - gap); addGem(s + 0.7, a); gemArc(s - 14, a, 3, 4); return 10; },
  s => { const a = rr(0, TAU), w = rr(1.0, 1.4) + diff * 0.5; addWall(s, a, w); addWall(s, a + PI, w); gemArc(s - 16, a + PI / 2, 4, 3.5); return 8; },
  s => { const a = rr(0, TAU), d = sgn() * rr(0.6, 1.0 + diff * 0.8), w = rr(1.5, 2.0); addWall(s, a, w, 1.4, d); addWall(s, a + PI, w, 1.4, d); return 12; },
  s => { const a = rr(0, TAU), d = sgn(), n = 5 + Math.floor(diff * 4); for (let i = 0; i < n; i++) { addWall(s + i * 7, a + d * i * 0.55, 1.5 + diff * 0.5); addGem(s + i * 7 + 0.7, a + d * i * 0.55 + PI); } return n * 7 + 4; },
  s => { let a = rr(0, TAU); const n = 3 + Math.floor(diff * 3), gap = 1.55 - diff * 0.4; for (let i = 0; i < n; i++) { addWall(s + i * 15, a + PI, TAU - gap); addGem(s + i * 15 + 0.7, a); a += rr(0.8, 1.7) * sgn(); } return n * 15; },
  s => { const a = rr(0, TAU), sp = sgn() * rr(0.4, 0.8 + diff * 0.6); for (let k = 0; k < 3; k++) addWall(s, a + k * TAU / 3, 1.15 + diff * 0.3, 1.4, sp); return 12; },
  s => { const a = rr(0, TAU), d = sgn(); gemArc(s, a, 14, 3, d * 0.32); if (rand() < 0.45) addShield(s + 46, a + d * 0.32 * 15); return 50; },
  s => { const a = rr(0, TAU); for (let i = 0; i < 4; i++) addWall(s + i * 3, a + (i % 2) * PI, PI - 0.55 + diff * 0.15); return 14; },
];
function spawn() {
  while (nextS < dist + 210) {
    const unlocked = Math.min(PATTERNS.length, 3 + Math.floor(dist / 600));
    let idx = Math.floor(rand() * unlocked);
    if (rand() < 0.1) idx = 7;
    const len = PATTERNS[idx](nextS);
    nextS += len + lerp(36, 20, diff);
  }
}

// ---------- HUD ----------
const hud = { score: $('score'), mult: $('mult'), cf: $('combofill'), dist: $('dist'), spd: $('spd'), sec: $('sector'), odf: $('odfill'), odb: $('odbar'), odl: $('odlabel'), center: $('center'), sh: $('shieldIco'), odbtn: $('odbtn') };
let centerTO = 0;
function announce(txt, ms = 1400) {
  hud.center.textContent = txt; hud.center.style.opacity = 1;
  clearTimeout(centerTO); centerTO = setTimeout(() => hud.center.style.opacity = 0, ms);
}
function pop(txt, color) {
  const d = document.createElement('div'); d.className = 'pop'; d.textContent = txt; d.style.color = color;
  d.style.marginLeft = rr(-40, 40) + 'px';
  $('hud').appendChild(d); setTimeout(() => d.remove(), 950);
}
const isTouch = matchMedia('(pointer: coarse)').matches;

// ---------- events ----------
function shipWorld() { return { x: Math.cos(theta) * PR, y: Math.sin(theta) * PR }; }
function addCombo() {
  combo++; comboT = COMBO_TIME;
  const nm = Math.min(16, 1 + Math.floor(combo / 5));
  if (nm > mult) { mult = nm; maxMult = Math.max(maxMult, mult); pop(`x${mult} MULTIPLIER!`, 'var(--c2)'); sfx.mult(); }
}
function addMeter(v) {
  if (od > 0) return;
  meter = Math.min(100, meter + v);
  if (meter >= 100 && !odReadyShown) { odReadyShown = true; announce(isTouch ? 'OVERDRIVE READY!' : 'OVERDRIVE READY — SPACE!', 1600); }
}
function collect(o) {
  o.remove = true;
  const p = o.mesh.position;
  if (o.type === 'gem') {
    gems++; addCombo(); score += 50 * mult; addMeter(5); sfx.gem(combo);
    emit(p.x, p.y, p.z, col.gem, 18, 6, 0.5, speed * 0.3);
  } else {
    shield = true; sfx.shield(); pop('SHIELD!', '#66ccff');
    emit(p.x, p.y, p.z, tmpC.setHex(0x66ccff), 40, 8, 0.7);
  }
}
function nearMiss() {
  nears++; addCombo(); const pts = 120 * mult; score += pts; addMeter(10);
  slowmo = 0.14; fovKick = 10; sfx.near();
  pop(`NEAR MISS +${pts}`, 'var(--c3)');
  const w = shipWorld(); emit(w.x, w.y, 0.5, col.tube, 25, 10, 0.4, speed * 0.4);
}
function smash(o) {
  o.dead = true; o.mesh.visible = false; smashes++;
  const pts = 200 * mult; score += pts; shake = Math.max(shake, 0.5); sfx.smash();
  pop(`SMASH +${pts}`, 'var(--c1)');
  for (let i = 0; i < 6; i++) {
    const a = o.ang + rr(-o.width / 2, o.width / 2), r = rr(R - 1.7, R);
    emit(Math.cos(a) * r, Math.sin(a) * r, o.mesh.position.z, col.obs, 14, 14, 0.9, speed * 0.4);
  }
}
function activateOD() {
  if (state !== 'play' || meter < 100 || od > 0) return;
  od = OD_TIME; odReadyShown = false; sfx.power(); shake = 0.4; fovKick = 14;
  announce('OVERDRIVE!!', 1200);
}
function die() {
  state = 'dead'; deathT = 0; musicOn = false; sfx.crash(); shake = 1.4;
  const w = shipWorld();
  emit(w.x, w.y, 0, col.tube, 160, 18, 1.6); emit(w.x, w.y, 0, col.gem, 90, 10, 1.4); emit(w.x, w.y, 0, tmpC.setHex(0xffffff), 50, 24, 0.8);
  ship.visible = false;
  if (mFilter) mFilter.frequency.setTargetAtTime(300, actx.currentTime, 0.3);
  const fs = Math.floor(score), isNew = fs > best, fd = Math.floor(dist);
  if (isNew) { best = fs; try { localStorage.setItem('vortexrush_best', best); } catch (e) {} }
  const rank = fs >= 200000 ? 'S' : fs >= 80000 ? 'A' : fs >= 25000 ? 'B' : fs >= 6000 ? 'C' : 'D';
  const rc = { S: '#ffe14d', A: '#ff2bd6', B: '#00f0ff', C: '#00ff9d', D: '#aaaaaa' }[rank];
  setTimeout(() => {
    $('rank').textContent = rank; $('rank').style.color = rc; $('rank').style.textShadow = `0 0 30px ${rc}`;
    $('newrec').classList.toggle('hidden', !isNew);
    $('stats').innerHTML = `SCORE <b>${fs.toLocaleString()}</b><br>BEST ${best.toLocaleString()}<br>` +
      `DISTANCE ${fd.toLocaleString()} m ・ SECTOR ${sector + 1}<br>` +
      `💎 ${gems}　⚡ NEAR MISS ${nears}　🔥 SMASH ${smashes}　MAX x${maxMult}`;
    $('over').classList.remove('hidden');
  }, 1300);
}
function startGame() {
  initAudio();
  for (const o of objs) removeObj(o);
  objs = [];
  dist = 0; speed = 30; theta = -PI / 2; omega = 0; camTheta = -PI / 2;
  score = 0; combo = 0; comboT = 0; mult = 1; maxMult = 1; meter = 0; od = 0; shield = false; inv = 0;
  sector = 0; diff = 0; nextS = 110; slowmo = 0; shake = 0; gems = nears = smashes = 0; odReadyShown = false;
  theme = THEMES[0]; setCss();
  ship.visible = true;
  $('title').classList.add('hidden'); $('over').classList.add('hidden');
  state = 'play';
  musicOn = true; step = 0; nextT = actx.currentTime + 0.06;
  mFilter.frequency.setTargetAtTime(2400, actx.currentTime, 0.1);
  announce('SECTOR 1', 1200);
}

// ---------- input ----------
const keys = { l: false, r: false };
let touchL = false, touchR = false;
const touches = new Map();
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = true;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (state === 'play') activateOD();
    else if (state === 'title' || (state === 'dead' && !$('over').classList.contains('hidden'))) startGame();
  }
  if (e.code === 'KeyR' && state === 'dead' && !$('over').classList.contains('hidden')) startGame();
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.55; }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
});
function updTouch() { touchL = touchR = false; for (const x of touches.values()) { if (x < innerWidth / 2) touchL = true; else touchR = true; } }
const cv = renderer.domElement;
cv.addEventListener('touchstart', e => { e.preventDefault(); for (const t of e.changedTouches) touches.set(t.identifier, t.clientX); updTouch(); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) touches.set(t.identifier, t.clientX); updTouch(); }, { passive: false });
const tEnd = e => { for (const t of e.changedTouches) touches.delete(t.identifier); updTouch(); };
cv.addEventListener('touchend', tEnd); cv.addEventListener('touchcancel', tEnd);
$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);
hud.odbtn.addEventListener('click', activateOD);
hud.odbtn.addEventListener('touchstart', e => { e.preventDefault(); activateOD(); }, { passive: false });

// ---------- update ----------
function playUpdate(dt) {
  const dir = ((keys.r || touchR) ? 1 : 0) - ((keys.l || touchL) ? 1 : 0);
  const maxW = 3.1 + diff * 0.9;
  omega += (dir * maxW - omega) * Math.min(1, dt * 14);
  theta += omega * dt;
  diff = Math.min(1, dist / 14000);
  const base = 34 + Math.min(dist, 25000) * 0.0021;
  speed += ((od > 0 ? base * 1.75 : base) - speed) * Math.min(1, dt * 2.5);
  dist += speed * dt;
  score += speed * dt * 0.5;
  if (od > 0) { od -= dt; meter = Math.max(0, od / OD_TIME * 100); if (od <= 0) { od = 0; meter = 0; inv = 0.6; } }
  if (inv > 0) inv -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; mult = 1; } }
  const sec = Math.floor(dist / 1200);
  if (sec !== sector) { sector = sec; theme = THEMES[sec % THEMES.length]; setCss(); announce(`SECTOR ${sec + 1}`); sfx.power(); }
  spawn();
  // engine trail
  const w = shipWorld();
  emit(w.x + rr(-0.1, 0.1), w.y + rr(-0.1, 0.1), 1.0, od > 0 ? col.gem : col.tube, od > 0 ? 4 : 2, 1.2, 0.35, speed * 0.5);
}

function updateObjects(dt) {
  const playing = state === 'play';
  for (const o of objs) {
    const z = dist - o.s;
    if (o.type === 'wall') {
      if (o.spin) { o.ang += o.spin * dt; o.mesh.rotation.z = o.ang; }
      o.mesh.position.z = z;
      if (playing && !o.dead && z < 0.75 && z + o.depth > -0.75) {
        const clear = Math.abs(angDiff(theta, o.ang)) - (o.width / 2 + PHALF);
        if (clear < 0) {
          if (od > 0 || inv > 0) smash(o);
          else if (shield) { shield = false; inv = 0.5; smash(o); pop('SHIELD BREAK', '#66ccff'); }
          else { die(); return; }
        } else o.minClear = Math.min(o.minClear, clear);
      }
      if (!o.passed && z > 0.75) { o.passed = true; if (playing && !o.dead && od <= 0 && o.minClear < 0.22) nearMiss(); }
      if (z > 14) o.remove = true;
    } else {
      if (playing && od > 0 && z > -40 && z < 1) o.ang += angDiff(theta, o.ang) * Math.min(1, dt * 7); // OD magnet
      o.mesh.position.set(Math.cos(o.ang) * PR, Math.sin(o.ang) * PR, z);
      o.mesh.rotation.y += dt * 3; o.mesh.rotation.x += dt * 1.7;
      if (o.type === 'gem') o.mesh.scale.setScalar(1 + Math.sin(time * 8 + o.s) * 0.15);
      if (playing && Math.abs(z) < 1.1 && Math.abs(angDiff(theta, o.ang)) < 0.3) collect(o);
      if (z > 14) o.remove = true;
    }
  }
  if (objs.some(o => o.remove)) objs = objs.filter(o => { if (o.remove) { removeObj(o); return false; } return true; });
}

function updateColors(dt) {
  const k = 1 - Math.exp(-dt * 2.2);
  for (const key in col) col[key].lerp(tmpC.setHex(theme[key]), k);
  tubeMat.uniforms.uColor.value.copy(col.tube);
  tubeMat.uniforms.uBg.value.copy(col.bg);
  scene.background.copy(col.bg); scene.fog.color.copy(col.bg);
  obsFill.color.copy(col.obs).multiplyScalar(0.18);
  obsEdge.color.copy(col.obs).multiplyScalar(1.6);
  gemMat.color.copy(col.gem).multiplyScalar(1.3);
  shipWingEdge.color.copy(col.tube).multiplyScalar(1.5);
  engine.material.color.copy(od > 0 ? col.gem : col.tube).multiplyScalar(2);
}

function update(dtR) {
  let ts = 1;
  if (slowmo > 0) { slowmo -= dtR; ts = 0.4; }
  if (state === 'dead') { deathT += dtR; ts = 0.25 + Math.min(0.75, deathT * 0.5); }
  const dt = dtR * ts;
  updateColors(dtR);
  pulse *= Math.exp(-dtR * 7);
  tubeMat.uniforms.uPulse.value = pulse * 0.6 + (od > 0 ? 0.6 + Math.sin(time * 30) * 0.2 : 0);

  if (state === 'title') {
    speed = 30; dist += speed * dt;
    const t2 = time * 0.6; theta = -PI / 2 + Math.sin(t2) * 1.3; omega = Math.cos(t2) * 0.78;
    const w = shipWorld(); emit(w.x, w.y, 1.0, col.tube, 2, 1.2, 0.35, speed * 0.5);
    const sec = Math.floor(time / 6) % THEMES.length;
    if (theme !== THEMES[sec]) { theme = THEMES[sec]; setCss(); }
  } else if (state === 'play') {
    playUpdate(dt);
  } else {
    speed *= Math.exp(-dt * 1.2); dist += speed * dt;
  }
  tubeMat.uniforms.uDist.value = dist;
  updateObjects(dt);

  // ship
  ship.position.set(Math.cos(theta) * PR, Math.sin(theta) * PR, 0);
  ship.rotation.z = theta + PI / 2;
  shipInner.rotation.z = -omega * 0.13;
  shipInner.position.y = Math.sin(time * 7) * 0.05;
  engine.scale.setScalar(1 + Math.sin(time * 40) * 0.2 + (od > 0 ? 0.6 : 0));
  shieldBubble.visible = shield && state === 'play';
  shieldBubble.rotation.x += dtR * 1.5; shieldBubble.rotation.y += dtR;

  updStreaks(dt);
  updParticles(dt);

  // camera
  camTheta += angDiff(theta, camTheta) * Math.min(1, dtR * 7);
  const cr = PR - 3.5, lr = PR - 2.2;
  camera.position.set(Math.cos(camTheta) * cr, Math.sin(camTheta) * cr, 7.5);
  camera.up.set(-Math.cos(camTheta), -Math.sin(camTheta), 0);
  camera.lookAt(Math.cos(camTheta) * lr, Math.sin(camTheta) * lr, -30);
  if (shake > 0) {
    camera.position.x += (rand() - 0.5) * shake; camera.position.y += (rand() - 0.5) * shake;
    shake = Math.max(0, shake - dtR * 2.2);
  }
  fovKick *= Math.exp(-dtR * 4);
  const fovT = 70 + (speed - 30) * 0.28 + fovKick;
  camera.fov += (Math.min(115, fovT) - camera.fov) * Math.min(1, dtR * 5);
  camera.updateProjectionMatrix();
  bloom.strength = 0.75 + pulse * 0.2 + (od > 0 ? 0.4 : 0);

  if (mFilter && state === 'play') mFilter.frequency.setTargetAtTime(od > 0 ? 9000 : (slowmo > 0 ? 700 : 2400), actx.currentTime, 0.05);

  // HUD
  hud.score.textContent = Math.floor(score).toLocaleString();
  hud.mult.textContent = 'x' + mult + (combo > 0 ? `  ${combo} COMBO` : '');
  hud.cf.style.width = (Math.max(0, comboT) / COMBO_TIME * 100) + '%';
  hud.dist.textContent = Math.floor(dist).toLocaleString() + ' m';
  hud.spd.textContent = Math.round(speed * 12) + ' km/h';
  hud.sec.textContent = 'SECTOR ' + (sector + 1);
  hud.odf.style.width = meter + '%';
  const full = meter >= 100 && od <= 0;
  hud.odb.classList.toggle('full', full || od > 0);
  hud.odl.textContent = od > 0 ? 'OVERDRIVE ACTIVE' : full ? (isTouch ? 'OVERDRIVE READY' : 'OVERDRIVE READY [SPACE]') : 'OVERDRIVE';
  hud.odbtn.style.display = (isTouch && full && state === 'play') ? 'block' : 'none';
  hud.sh.classList.toggle('hidden', !shield);
  $('hud').style.opacity = state === 'title' ? 0 : 1;
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dtR = Math.min(clock.getDelta(), 0.05);
  time += dtR;
  update(dtR);
  composer.render();
}
setCss();
loop();
</script>
</body>
</html>
